# =============================================================
# タイムカード自動確認スクリプト 設定ファイル
# =============================================================

# 対象ページURL（社内イントラ）
url: "http://report/ViewAttendance/ViewAttendance.php"

# 遅刻判定の基準時刻（HH:MM形式）
# この時刻の「次の分」以降を遅刻とする
# 例: "09:30" → 9:30まで正常、9:31以降が遅刻
late_threshold: "09:30"

# 朝チェックモード
# true: 退勤未打刻を警告対象から除外する（午前実行時は true 推奨）
# false: 退勤未打刻も警告対象に含める（夜間チェック時に使用）
morning_check_mode: true

# タスクスケジューラ設定の参考値（スクリプト自体はここを読まない）
schedule_time: "10:00"

# -----------------------------------------------------------------
# 打刻データ取得失敗時のリトライ
# -----------------------------------------------------------------
# 打刻データを1件も取得できなかった場合（勤怠システム停止・ネットワーク
# 不調などの可能性）、指定分後に再試行する。
# retry_on_failure: 再試行の回数（0でリトライ無効・即エラーレポート）
# retry_interval_minutes: 再試行までの待機時間（分）
# すべて失敗した場合は「取得できませんでした」レポートをメール／Slackで通知する。
retry_on_failure: 1
retry_interval_minutes: 15

# -----------------------------------------------------------------
# メール設定
# -----------------------------------------------------------------
email:
  smtp_server: "mail.e-trek-japan.com"    # 社内SMTPサーバーのホスト名/IP
  smtp_port: 587                      # 587(STARTTLS) / 465(SSL) / 25(平文)
  use_tls: true                       # STARTTLS を使う場合は true
  use_ssl: false                      # SMTPS(ポート465)を使う場合は true
  sender: "tomokazu_miura@e-trek-japan.com"
  # パスワードはWindowsの資格情報マネージャーに保存します（config.yamlには書きません）
  # 初回登録コマンド:
  #   python -c "import keyring; keyring.set_password('timecard_notifier', 'tomokazu_miura@e-trek-japan.com', 'パスワード')"
  recipients:
    - "tomokazu_miura@e-trek-japan.com"
    - "miura@e-trek-japan.com"

# -----------------------------------------------------------------
# Slack 設定
# -----------------------------------------------------------------
# Slack Incoming Webhook URL を設定する。使用しない場合は空文字にする。
# 例: https://hooks.slack.com/services/<T...>/<B...>/<トークン>
slack_webhook_url: ""

# -----------------------------------------------------------------
# 残業事前申請チェック（Excel参照）
# -----------------------------------------------------------------
# 前営業日に overtime_threshold 以降に退勤（残業）した社員について、
# 勤務状況管理シート（Excel）の事前申請時刻と照合し、
# 「申請なし」「申請時間超過」を検出して通知に追記する。
overtime:
  enabled: true

  # 勤務状況管理シートのパス（社内サーバーのUNCパスも可）
  # 例: "\\\\server\\share\\勤務状況管理シート.xlsx"
  excel_path: '\\lorthos\データ受け渡し\残業時間申請\【AM】残業時間管理(1日-末日)_2026年度.xlsx'

  # 残業とみなす退勤時刻の基準（この時刻以降の退勤を残業としてチェック）
  overtime_threshold: "18:30"

  # 集計単位（分）
  # 申請時刻から「unit_minutes - 1」分以内の退勤は超過とみなさない
  # 例: unit_minutes=15, 申請19:30 → 19:44まで許容、19:45以降が超過
  unit_minutes: 15

  # 月別シート名のフォーマット（{month}=月, {year}=年）
  # 例: "6月" になる
  sheet_name_format: "{month}月"

  # ----- シートのレイアウト（実際のExcelに合わせて調整）-----
  header_day_row: 13     # 日付（日番号 9,10,11...）が書かれている行
  subheader_row: 15      # 「申請 / 打刻 / 時間」が書かれている行
  name_column: "C"       # 氏名が書かれている列
  data_start_row: 16     # 社員データの開始行
